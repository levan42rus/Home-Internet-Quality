global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s


rule_files:
  - /etc/prometheus/rules/*.yml


scrape_configs:
  - job_name: blackbox
    metrics_path: /probe
    params:
      module:
        - icmp

    static_configs:
      - targets:
          - google.com
        labels:
          probe_target: google
          probe_type: icmp
      - targets:
          - ya.ru
        labels:
          probe_target: ya
          probe_type: icmp

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115


  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - https://google.com
        labels:
          probe_target: google
          probe_type: https
      - targets:
          - https://ya.ru
        labels:
          probe_target: ya
          probe_type: https

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115